# Cloudflare Workers configuration for MCP Server
# Update account_id with your Cloudflare account ID

name = "mcp-datagvat-server"
main = "src/index.ts"
compatibility_date = "2025-03-10"
compatibility_flags = ["nodejs_compat"]

# Account ID - replace with your Cloudflare account ID
# Find it at: https://dash.cloudflare.com/ -> Select your site -> Overview (right sidebar)
# account_id = "your-account-id-here"

# Worker configuration
workers_dev = true

# Durable Objects configuration
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DataGvatMCP"]

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "DataGvatMCP"

# Observability
[observability]
enabled = true

# Environment variables (optional)
# [vars]
# API_BASE_URL = "https://qs.data.gv.at/api/hub/repo"

